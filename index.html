<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joslath Odjaga – B3 RSI – Site test</title>
<style>
  :root {
    --vert: #0b5d3b;
    --vert-fonce: #06331f;
    --rouge: #ce1126;
    --jaune: #fcd116;
    --creme: #fff8dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(90deg, var(--vert) 0 33.33%, var(--rouge) 33.33% 66.66%, var(--jaune) 66.66% 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  main {
    background: var(--vert-fonce);
    color: var(--creme);
    border: 4px solid var(--creme);
    border-radius: 18px;
    padding: 28px 24px;
    width: 100%; max-width: 460px;
    text-align: center;
    box-shadow: 10px 10px 0 rgba(0,0,0,.35);
  }
  h1 { font-size: 2rem; letter-spacing: .5px; color: var(--jaune); }
  .classe {
    display: inline-block; margin: 10px 0 4px;
    background: var(--rouge); color: #fff;
    padding: 4px 16px; border-radius: 999px; font-weight: bold;
  }
  .sous-titre { opacity: .85; margin-bottom: 18px; }
  canvas {
    background: #021a10; border: 3px solid var(--jaune);
    border-radius: 8px; width: 100%; max-width: 360px; touch-action: none;
  }
  .score { margin: 12px 0; font-size: 1.1rem; }
  .score strong { color: var(--jaune); }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: bold; cursor: pointer;
    background: var(--jaune); color: var(--vert-fonce);
    border: 0; border-radius: 8px; padding: 10px 18px;
  }
  button:hover { background: #ffe45c; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; justify-content: center; margin-top: 14px; }
  .pad button { padding: 12px 0; font-size: 1.2rem; }
  .pad .haut { grid-column: 2; }
  .pad .bas { grid-column: 2; }
  .pad .gauche { grid-column: 1; grid-row: 2; }
  .pad .droite { grid-column: 3; grid-row: 2; }
  .pad .haut { grid-row: 1; } .pad .bas { grid-row: 3; }
  footer { margin-top: 16px; font-size: .85rem; opacity: .75; }
</style>
</head>
<body>
<main>
  <h1>Joslath Odjaga</h1>
  <span class="classe">B3 RSI</span>
  <p class="sous-titre">Site test – projet DevOps</p>

  <canvas id="jeu" width="360" height="360" aria-label="Jeu Snake"></canvas>
  <p class="score">Score : <strong id="score">0</strong> &nbsp;|&nbsp; Record : <strong id="record">0</strong></p>

  <div class="btns">
    <button id="start">Jouer</button>
  </div>
  <div class="pad" aria-label="Commandes">
    <button class="haut" data-d="haut" aria-label="Haut">▲</button>
    <button class="gauche" data-d="gauche" aria-label="Gauche">◀</button>
    <button class="droite" data-d="droite" aria-label="Droite">▶</button>
    <button class="bas" data-d="bas" aria-label="Bas">▼</button>
  </div>
  <footer>Flèches du clavier ou boutons pour diriger le serpent.</footer>
</main>

<script>
  const canvas = document.getElementById("jeu");
  const ctx = canvas.getContext("2d");
  const TAILLE = 18, N = canvas.width / TAILLE;
  const scoreEl = document.getElementById("score");
  const recordEl = document.getElementById("record");
  let serpent, dir, prochaineDir, pomme, score, record = 0, timer = null;

  function init() {
    serpent = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = prochaineDir = {x: 1, y: 0};
    score = 0; scoreEl.textContent = 0;
    placerPomme();
  }
  function placerPomme() {
    do {
      pomme = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)};
    } while (serpent.some(s => s.x === pomme.x && s.y === pomme.y));
  }
  function dessiner() {
    ctx.fillStyle = "#021a10";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ce1126";
    ctx.beginPath();
    ctx.arc(pomme.x * TAILLE + TAILLE / 2, pomme.y * TAILLE + TAILLE / 2, TAILLE / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    serpent.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#fcd116" : "#2fae6b";
      ctx.fillRect(s.x * TAILLE + 1, s.y * TAILLE + 1, TAILLE - 2, TAILLE - 2);
    });
  }
  function fin() {
    clearInterval(timer); timer = null;
    ctx.fillStyle = "rgba(0,0,0,.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fcd116";
    ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Perdu ! Score : " + score, canvas.width / 2, canvas.height / 2);
    document.getElementById("start").textContent = "Rejouer";
  }
  function tick() {
    dir = prochaineDir;
    const tete = {x: serpent[0].x + dir.x, y: serpent[0].y + dir.y};
    if (tete.x < 0 || tete.y < 0 || tete.x >= N || tete.y >= N ||
        serpent.some(s => s.x === tete.x && s.y === tete.y)) return fin();
    serpent.unshift(tete);
    if (tete.x === pomme.x && tete.y === pomme.y) {
      score++; scoreEl.textContent = score;
      if (score > record) { record = score; recordEl.textContent = record; }
      placerPomme();
    } else serpent.pop();
    dessiner();
  }
  function demarrer() {
    clearInterval(timer);
    init(); dessiner();
    timer = setInterval(tick, 120);
  }
  function changer(nom) {
    const d = {haut: {x:0,y:-1}, bas: {x:0,y:1}, gauche: {x:-1,y:0}, droite: {x:1,y:0}}[nom];
    if (d && (d.x !== -dir.x || d.y !== -dir.y)) prochaineDir = d;
  }
  document.getElementById("start").addEventListener("click", demarrer);
  document.querySelectorAll(".pad button").forEach(b =>
    b.addEventListener("click", () => changer(b.dataset.d)));
  document.addEventListener("keydown", e => {
    const m = {ArrowUp: "haut", ArrowDown: "bas", ArrowLeft: "gauche", ArrowRight: "droite"}[e.key];
    if (m) { e.preventDefault(); changer(m); }
  });
  init(); dessiner();
</script>
</body>
</html>
